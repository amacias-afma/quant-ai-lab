[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "value_at_risk"
version = "0.1.0"
description = "Anchored quantile models for Value-at-Risk forecasting (AFMA Quant AI Lab)"
authors = [{ name = "AFMA Lab" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
# Everything needed to actually run the study end to end.
run = [
    "yfinance>=0.2.0",
    "torch>=2.0.0",
    "arch>=6.0.0",
    "matplotlib>=3.5.0",
]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Make both the package (src/) and the top-level runners importable in tests without
# needing PYTHONPATH to be set by hand.
pythonpath = [".", "src"]
testpaths = ["tests"]
